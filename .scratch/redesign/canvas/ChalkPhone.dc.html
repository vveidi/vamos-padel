<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
  <style>
    body { margin: 0; }
    a { color: #b06a2c; } a:hover { color: #8a4f1c; }
  </style>
</helmet>

<div style="width: 393px; height: 852px; background: #f7f2e7; color: #221f1a; font-family: 'PT Serif', Georgia, serif; display: flex; flex-direction: column; box-sizing: border-box; padding: 62px 24px 0; overflow: hidden; position: relative;">

  <div style="position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(34, 31, 26, 0) 0 33px, rgba(34, 31, 26, 0.055) 33px 34px);"></div>

  <div style="position: relative; font-family: 'Caveat', cursive; font-size: 40px; font-weight: 700; line-height: 1;">History</div>

  <div style="position: relative; display: flex; flex-direction: column; margin-top: 20px;">
    <sc-for list="{{matches}}" as="match" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 16px; padding: 17px 0; border-bottom: 1px solid rgba(34, 31, 26, 0.14);">
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="font-size: 25px; font-weight: 700; letter-spacing: 0.4px; line-height: 1; color: {{match.scoreColor}};">{{match.score}}</div>
            <sc-if value="{{match.won}}" hint-placeholder-val="{{true}}">
              <svg width="26" height="18" viewBox="0 0 26 18" fill="none" stroke="#b06a2c" stroke-width="1.6" stroke-linecap="round"><path d="M13 2.2c6.2 0 11 2.9 11 6.6s-4.8 6.9-11 6.9S1.6 12.5 1.6 8.8 6.6 2.4 12.4 2.4"></path></svg>
            </sc-if>
          </div>
          <div style="font-size: 13px; font-style: italic; color: rgba(34, 31, 26, 0.6);">{{match.ruleset}}</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px; white-space: nowrap;">
          <div style="font-family: 'Caveat', cursive; font-size: 21px; color: rgba(34, 31, 26, 0.75);">{{match.day}}</div>
          <div style="font-size: 12px; color: rgba(34, 31, 26, 0.45);">{{match.duration}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 34px; height: 58px; border-radius: 999px; background: #221f1a; display: flex; align-items: center; justify-content: center;">
    <div style="font-family: 'Caveat', cursive; font-size: 26px; font-weight: 700; color: #f7f2e7;">New match</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const ink = '#221f1a';
    const faded = 'rgba(34,31,26,0.5)';
    return {
      matches: [
        { score: '2 : 1', ruleset: 'Classic scoring · 2 sets', day: '9 Sept', duration: '1 h 12 min', won: true, scoreColor: ink },
        { score: '16 : 14', ruleset: 'Scoring to 16 points', day: '7 Sept', duration: '38 min', won: true, scoreColor: ink },
        { score: '0 : 2', ruleset: 'Classic scoring · 2 sets', day: '5 Sept', duration: '54 min', won: false, scoreColor: faded },
        { score: '9 : 12', ruleset: 'Scoring to 21 points · stopped', day: '31 Aug', duration: '16 min', won: false, scoreColor: faded },
        { score: '21 : 19', ruleset: 'Scoring to 21 points', day: '24 Aug', duration: '47 min', won: true, scoreColor: ink },
      ],
    };
  }
}
</script>
</body>
</html>
